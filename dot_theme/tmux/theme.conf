# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#111418,fg=#e1e2e8"
set -g status-right "#[fg=#d8bde4,bg=#111418] #[fg=#3c2947,bg=#d8bde4,bold] #S "
setw -g window-status-format "#[fg=#8d9199,bg=#111418] #I:#W "
setw -g window-status-current-format "#[fg=#a2c9fe,bg=#111418] #[fg=#00325a,bg=#a2c9fe,bold] #I:#W #[fg=#a2c9fe,bg=#111418] "
set -g pane-border-style "fg=#1d2024"
set -g pane-active-border-style "fg=#a2c9fe"
set -g message-style "bg=#1d2024,fg=#e1e2e8"
