# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#131315,fg=#e4e2e3"
set -g status-right "#[fg=#bfc6dc,bg=#131315] #[fg=#293041,bg=#bfc6dc,bold] #S "
setw -g window-status-format "#[fg=#929092,bg=#131315] #I:#W "
setw -g window-status-current-format "#[fg=#c2c6d6,bg=#131315] #[fg=#2b303c,bg=#c2c6d6,bold] #I:#W #[fg=#c2c6d6,bg=#131315] "
set -g pane-border-style "fg=#1f1f21"
set -g pane-active-border-style "fg=#c2c6d6"
set -g message-style "bg=#1f1f21,fg=#e4e2e3"
