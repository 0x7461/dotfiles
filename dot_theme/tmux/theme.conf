# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#19120c,fg=#efe0d6"
set -g status-right "#[fg=#c5cb96,bg=#19120c] #[fg=#2e330d,bg=#c5cb96,bold] #S "
setw -g window-status-format "#[fg=#9e8e82,bg=#19120c] #I:#W "
setw -g window-status-current-format "#[fg=#ffb77d,bg=#19120c] #[fg=#4d2600,bg=#ffb77d,bold] #I:#W #[fg=#ffb77d,bg=#19120c] "
set -g pane-border-style "fg=#261e18"
set -g pane-active-border-style "fg=#ffb77d"
set -g message-style "bg=#261e18,fg=#efe0d6"
