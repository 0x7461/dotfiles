# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#1a120e,fg=#f0dfd8"
set -g status-right "#[fg=#d0c890,bg=#1a120e] #[fg=#353107,bg=#d0c890,bold] #S "
setw -g window-status-format "#[fg=#a08d85,bg=#1a120e] #I:#W "
setw -g window-status-current-format "#[fg=#ffb692,bg=#1a120e] #[fg=#542103,bg=#ffb692,bold] #I:#W #[fg=#ffb692,bg=#1a120e] "
set -g pane-border-style "fg=#271e1a"
set -g pane-active-border-style "fg=#ffb692"
set -g message-style "bg=#271e1a,fg=#f0dfd8"
