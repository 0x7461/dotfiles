# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#12140d,fg=#e3e3d7"
set -g status-right "#[fg=#a1d0c7,bg=#12140d] #[fg=#023732,bg=#a1d0c7,bold] #S "
setw -g window-status-format "#[fg=#909284,bg=#12140d] #I:#W "
setw -g window-status-current-format "#[fg=#b9cf83,bg=#12140d] #[fg=#263500,bg=#b9cf83,bold] #I:#W #[fg=#b9cf83,bg=#12140d] "
set -g pane-border-style "fg=#1f2019"
set -g pane-active-border-style "fg=#b9cf83"
set -g message-style "bg=#1f2019,fg=#e3e3d7"
