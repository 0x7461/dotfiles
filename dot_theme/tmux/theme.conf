# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#111318,fg=#e2e2e9"
set -g status-right "#[fg=#debcdf,bg=#111318] #[fg=#402843,bg=#debcdf,bold] #S "
setw -g window-status-format "#[fg=#8e9099,bg=#111318] #I:#W "
setw -g window-status-current-format "#[fg=#adc6ff,bg=#111318] #[fg=#102f60,bg=#adc6ff,bold] #I:#W #[fg=#adc6ff,bg=#111318] "
set -g pane-border-style "fg=#1e1f25"
set -g pane-active-border-style "fg=#adc6ff"
set -g message-style "bg=#1e1f25,fg=#e2e2e9"
