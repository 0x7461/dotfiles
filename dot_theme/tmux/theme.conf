# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg=#191113,fg=#efdee1"
set -g status-right "#[fg=#edbe92,bg=#191113] #[fg=#472a0a,bg=#edbe92,bold] #S "
setw -g window-status-format "#[fg=#9e8c8f,bg=#191113] #I:#W "
setw -g window-status-current-format "#[fg=#ffb1c3,bg=#191113] #[fg=#551d2e,bg=#ffb1c3,bold] #I:#W #[fg=#ffb1c3,bg=#191113] "
set -g pane-border-style "fg=#261d1f"
set -g pane-active-border-style "fg=#ffb1c3"
set -g message-style "bg=#261d1f,fg=#efdee1"
