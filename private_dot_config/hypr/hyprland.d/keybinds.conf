# @see https://wiki.hyprland.org/Configuring/Binds/

# mods
$mod = SUPER # use "Windows" key as main modifier
$mod_s = SUPER_SHIFT
$mod_a = SUPER_ALT

# programs and shortcuts
bind = $mod, C, killactive,
bind = $mod, V, togglefloating,
bind = $mod, Return, exec, $terminal
bind = $mod_s, Return, exec, alacritty
bind = $mod, O, exec, $menu
bind = $mod_s, Q, exec, power-menu
bind = $mod, L, exec, hyprlock

# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod_s, 1, movetoworkspace, 1
bind = $mod_s, 2, movetoworkspace, 2
bind = $mod_s, 3, movetoworkspace, 3
bind = $mod_s, 4, movetoworkspace, 4
bind = $mod_s, 5, movetoworkspace, 5
bind = $mod_s, 6, movetoworkspace, 6
bind = $mod_s, 7, movetoworkspace, 7
bind = $mod_s, 8, movetoworkspace, 8
bind = $mod_s, 9, movetoworkspace, 9
bind = $mod_s, 0, movetoworkspace, 10

# special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod_s, S, movetoworkspace, special:magic

# Laptop multimedia keys for volume and LCD brightness (with wob overlay)
# Note: wob writes use timeout to avoid blocking if wob is not running
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+; timeout 0.1 bash -c 'wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{printf \"%d\\n\", \$2*100}" > $XDG_RUNTIME_DIR/wob-vol.sock'
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; timeout 0.1 bash -c 'wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{printf \"%d\\n\", \$2*100}" > $XDG_RUNTIME_DIR/wob-vol.sock'
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; timeout 0.1 bash -c 'wpctl get-volume @DEFAULT_AUDIO_SINK@ | grep -q MUTED && echo 0 > $XDG_RUNTIME_DIR/wob-vol.sock || wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{printf \"%d\\n\", \$2*100}" > $XDG_RUNTIME_DIR/wob-vol.sock'
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+; timeout 0.1 bash -c 'brightnessctl -m | awk -F, "{print substr(\$4, 0, length(\$4)-1)}" > $XDG_RUNTIME_DIR/wob-br.sock'
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-; timeout 0.1 bash -c 'brightnessctl -m | awk -F, "{print substr(\$4, 0, length(\$4)-1)}" > $XDG_RUNTIME_DIR/wob-br.sock'

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# screenshot menu / quick region capture
bind = , Print, exec, screenshot-region
bind = $mod, Print, exec, screenshot-menu

# file manager
bind = $mod, F, exec, ghostty -e yazi

