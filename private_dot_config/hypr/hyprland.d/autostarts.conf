# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = waybar & hyprpaper & firefox

# wallpaper
exec-once = hyprpaper 

# sound: pipewire/wireplumber/pipewire-pulse are runit-supervised under ~/service/.
# Independent of compositor lifetime — no autostart needed.
# exec-once = ~/.local/bin/start-sound.sh

# polkit auth agent
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# notification daemon: mako
exec-once = mako

# idle daemon: hypridle
exec-once = hypridle

# user services (github-trending, video-archiver, etc.)
exec-once = runsvdir ~/service

# wob (overlay bars: brightness left, volume right)
exec-once = rm -f $XDG_RUNTIME_DIR/wob-vol.sock && mkfifo $XDG_RUNTIME_DIR/wob-vol.sock && tail -f $XDG_RUNTIME_DIR/wob-vol.sock | wob -c ~/.config/wob/volume.ini
exec-once = rm -f $XDG_RUNTIME_DIR/wob-br.sock && mkfifo $XDG_RUNTIME_DIR/wob-br.sock && tail -f $XDG_RUNTIME_DIR/wob-br.sock | wob -c ~/.config/wob/brightness.ini

# eww bar retired 2026-05-21 — config archived to ~/obsidian-vault/system/configs/eww/
# Replaced with on-demand notifications (clock/weather binds) — niri-friendly, no IPC coupling.
# exec-once = eww daemon && ~/.config/eww/scripts/start-bar.sh

# input method
exec-once = fcitx5 -d

# removable storage automount (SD cards, USB drives)
exec-once = udiskie --tray

# autostart applications
# exec-once = [workspace 1 silent] $terminal

