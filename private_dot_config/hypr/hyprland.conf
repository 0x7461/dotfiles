# Hyprland config file
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# @see https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto

# External TV via DP - native 1366x768, avoids overscan
monitor=DP-1,1366x768@59.79,1728x0,1

# Bind workspace 10 to the TV and make it the default when connected
workspace = 10, monitor:DP-1, default:true


###################
### MY PROGRAMS ###
###################

# @see https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$menu = pkill wofi || wofi --show drun


#############################
### ENVIRONMENT VARIABLES ###
#############################

# @see https://wiki.hyprland.org/Configuring/Environment-variables/

env = HYPRCURSOR_THEME,
env = HYPRCURSOR_SIZE,20
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,20

# NVIDIA Wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = LIBVA_DRIVER_NAME,nvidia  # disabled - use Intel VA-API for video decode
env = WLR_NO_HARDWARE_CURSORS,1

# fcitx5 input method
# GTK_IM_MODULE intentionally unset — use Wayland input method frontend instead
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx


#################
### AUTOSTART ###
#################
source = ~/.config/hypr/hyprland.d/autostarts.conf


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = master
}

# @see https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
    new_on_top = true
}

# visual effects: decorations, animations
source = ~/.config/hypr/hyprland.d/visualeffects.conf


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    follow_mouse = 2
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    kb_options = ctrl:nocaps # remap capslock to ctrl

    touchpad {
    	disable_while_typing = true
        natural_scroll = false
	drag_lock = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
source = ~/.config/hypr/hyprland.d/keybinds.conf


##############################
### WINDOWS AND WORKSPACES ###
##############################
source = ~/.config/hypr/hyprland.d/windows-and-workspaces.conf


##############################
###    MISC AND DEBUG      ###
##############################
# @see https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # set to 0 or 1 to disable the mascot wallpapers
    disable_hyprland_logo = true # disables the random hyprland wallpapers
}

debug {
    disable_logs = false
    disable_time = false
    enable_stdout_logs = true
}

