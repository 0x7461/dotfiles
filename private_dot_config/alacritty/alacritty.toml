[general]
import = [ "~/.config/alacritty/themes/macchiato.toml" ]

[window]
opacity = 1
padding = { x = 5, y = 5 }

[font]
size = 12
#normal = { family = "JetBrains Mono", style = "Regular" }
#bold = { family = "JetBrains Mono", style = "Bold" }
#italic = { family = "JetBrains Mono", style = "Italic" }
#bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }

normal = { family = "Iosevka Term", style = "Regular" }
bold = { family = "Iosevka Term", style = "Bold" }
italic = { family = "Iosevka Term", style = "Italic" }
bold_italic = { family = "Iosevka Term", style = "Bold Italic" }

[terminal]
shell = { program = "/usr/bin/fish" }

[env]
USE_TMUX = "1"

