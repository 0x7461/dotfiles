[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
# FileChooser → gtk: gnome's impl delegates to nautilus, which isn't installed,
# so calls succeed silently at D-Bus but never show a dialog. gtk's FileChooser
# is self-contained.
org.freedesktop.impl.portal.FileChooser=gtk;
