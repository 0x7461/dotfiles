volume=60
vo=gpu-next
ao=pipewire

# Hyprland 0.49 advertises wp_color_manager_v1 (render:cm_enabled=1), and mpv/libplacebo
# then elects PQ (HDR) for the surface even though Hyprland drives the OLED at XRGB8888
# (8-bit SDR). Result: blown-out video. Pin SDR target until HDR is wired end-to-end.
# See ~/obsidian-vault/system/hyprland.md "HDR backlog" for the proper enable path.
target-trc=srgb
target-prim=bt.709
