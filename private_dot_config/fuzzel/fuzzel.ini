# #74 accent-only theming: selection colors are generated by matugen
# (do not set selection/selection-match/selection-text in [colors] below)
include=~/.theme/fuzzel/colors.ini

font=JetBrains Mono:size=12
dpi-aware=auto
prompt=>
layer=overlay
width=40
lines=15
horizontal-pad=20
vertical-pad=20
inner-pad=10
icon-theme=Adwaita

[colors]
background=24273af0
text=cad3f5ff
match=c6a0f6ff
border=c6a0f6ff
prompt=a5adcbff
placeholder=6e738dff
input=cad3f5ff

[border]
width=2
radius=10

[dmenu]
exit-on-keyboard-focus-loss=yes
