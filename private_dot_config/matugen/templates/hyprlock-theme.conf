# Generated by matugen — do not hand-edit. Source: ~/.config/matugen/templates/hyprlock-theme.conf
# Overrides a subset of the Macchiato palette vars for hyprlock (#74).
# Sourced AFTER macchiato.conf — undefined vars fall back to Macchiato.
# Labels sit on the blurred (light) wallpaper -> light-scheme (dark) text;
# the input box is a dark surface -> dark-scheme (light) text.
# Contrast machinery (white-halo shadows) stays in hyprlock.conf, not here.

# background fallback behind blur
$base = rgb({{colors.background.dark.hex_stripped}})
$baseAlpha = {{colors.background.dark.hex_stripped}}

# label text over the light wallpaper
$mantle = rgb({{colors.on_background.light.hex_stripped}})
$mantleAlpha = {{colors.on_background.light.hex_stripped}}

# dim label (fingerprint hint)
$overlay0 = rgb({{colors.outline.light.hex_stripped}})
$overlay0Alpha = {{colors.outline.light.hex_stripped}}

# input box: dark surface + light text
$surface0 = rgb({{colors.surface_container.dark.hex_stripped}})
$surface0Alpha = {{colors.surface_container.dark.hex_stripped}}
$text = rgb({{colors.on_surface.dark.hex_stripped}})
$textAlpha = {{colors.on_surface.dark.hex_stripped}}

# $accent in hyprlock.conf derives from $subtext0. It colors the input-box ring
# AND the placeholder/check text INSIDE the dark box -> must be light (dark scheme).
$subtext0 = rgb({{colors.primary.dark.hex_stripped}})
$subtext0Alpha = {{colors.primary.dark.hex_stripped}}

# auth-fail color (shown in the dark input box)
$red = rgb({{colors.error.dark.hex_stripped}})
$redAlpha = {{colors.error.dark.hex_stripped}}
