# All tmux status/pane/message styling (#74). Layout strings (#S, #I:#W) live
# here too since tmux mixes style+content in one option.
set -g status-style "bg={{colors.background.default.hex}},fg={{colors.on_background.default.hex}}"
set -g status-right "#[fg={{colors.tertiary.default.hex}},bg={{colors.background.default.hex}}] #[fg={{colors.on_tertiary.default.hex}},bg={{colors.tertiary.default.hex}},bold] #S "
setw -g window-status-format "#[fg={{colors.outline.default.hex}},bg={{colors.background.default.hex}}] #I:#W "
setw -g window-status-current-format "#[fg={{colors.primary.default.hex}},bg={{colors.background.default.hex}}] #[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] #I:#W #[fg={{colors.primary.default.hex}},bg={{colors.background.default.hex}}] "
set -g pane-border-style "fg={{colors.surface_container.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g message-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
