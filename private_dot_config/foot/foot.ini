# foot — break-glass / tmux-persistence terminal (#79), replaces alacritty.
# CPU-rendered + Wayland-native: no GPU/GL dependency, so it survives the
# driver/GTK breakage that could take out ghostty (the whole reason it's the backup).
#
# shell line replicates alacritty's `[env] USE_TMUX=1` + `shell=fish`: every foot
# launch gets USE_TMUX=1, so conf.d/tmux.fish `exec tmux new-session -A -s main`.

# #74: surfaces + structural grays (0/7/8/15) are matugen-generated; the
# semantic ANSI below stays fixed. include must sit in the default (top) section.
include=~/.theme/foot/colors.ini

[main]
font=Iosevka Term:size=12
pad=5x5
shell=env USE_TMUX=1 /usr/bin/fish

# Semantic ANSI (1-6 = bright 1-6): "modus-blend", kept fixed (red must mean
# red — #74). Midpoint of modus-vivendi main/faint; derivation in niri/PLAN.md.
# bg/fg/cursor/selection + structural grays (0/7/8/15) live in the matugen
# include above (keys are disjoint, so section order doesn't matter).
# [colors-dark] applies when the system prefers dark or has no preference.
[colors-dark]
regular1=ff7e6f
regular2=6dc37c
regular3=d1b95c
regular4=63b0f6
regular5=e6a9d8
regular6=70ced8
bright1=ff7e6f
bright2=6dc37c
bright3=d1b95c
bright4=63b0f6
bright5=e6a9d8
bright6=70ced8
16=f5a97f
17=f4dbd6
