# foot — break-glass / tmux-persistence terminal (#79), replaces alacritty.
# CPU-rendered + Wayland-native: no GPU/GL dependency, so it survives the
# driver/GTK breakage that could take out ghostty (the whole reason it's the backup).
#
# shell line replicates alacritty's `[env] USE_TMUX=1` + `shell=fish`: every foot
# launch gets USE_TMUX=1, so conf.d/tmux.fish `exec tmux new-session -A -s main`.

[main]
font=Iosevka Term:size=12
pad=5x5
shell=env USE_TMUX=1 /usr/bin/fish

# Catppuccin Macchiato (matches the rest of the system).
# [colors-dark] is the current key; foot uses it when the system prefers dark or
# has no preference. Cursor colour lives here as `cursor=<text> <cursor>`.
[colors-dark]
foreground=cad3f5
background=24273a
cursor=24273a f4dbd6
regular0=494d64
regular1=ed8796
regular2=a6da95
regular3=eed49f
regular4=8aadf4
regular5=f5bde6
regular6=8bd5ca
regular7=b8c0e0
bright0=5b6078
bright1=ed8796
bright2=a6da95
bright3=eed49f
bright4=8aadf4
bright5=f5bde6
bright6=8bd5ca
bright7=a5adcb
16=f5a97f
17=f4dbd6
selection-foreground=cad3f5
selection-background=5b6078
