# aerc — read the local notmuch index (Phase 1 is archive/read-only; no sending set up).
# REQUIRES aerc built with notmuch support. Verify after install:
#     aerc  ->  if "notmuch" backend errors, this build lacks the tag.
# Fallback: neomutt + notmuch, or notmuch-emacs.

[gmail]
source        = notmuch://~/mail
maildir-store = ~/mail
from          = im.bitter.smiles@gmail.com
# Named notmuch queries surfaced as folders in the sidebar:
query-map     = ~/.config/aerc/gmail.qmap
