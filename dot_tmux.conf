# change prefix
set-option -g prefix C-a
# unbind to prevent conflicts
unbind C-b
# retain shell navigation (bash, zsh)
bind C-a send-prefix
# start windows at 1
set -g base-index 1
# start panes at 1
setw -g pane-base-index 1

# Pull Wayland/PipeWire env vars from the attaching client on each attach
set-option -g update-environment "WAYLAND_DISPLAY XDG_RUNTIME_DIR PIPEWIRE_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS"

# Fallback defaults — update-environment strips vars when SSH/TTY client attaches
# without them, which crashes starship. These provide a safe baseline.
set-environment -g XDG_RUNTIME_DIR "/run/user/1000"
set-environment -g PIPEWIRE_RUNTIME_DIR "/run/user/1000"

# True color for Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Copy mode: vi keys + Wayland clipboard
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Mouse
set -g mouse on

# Splits: | and -, inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

# Window numbering: keep contiguous
set -g renumber-windows on

# Status bar: minimal, Catppuccin Macchiato, right-aligned
set -g status on
set -g status-position bottom
set -g status-justify right
set -g status-interval 5
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 40
set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-right "#[fg=#c6a0f6,bg=#24273a] #[fg=#24273a,bg=#c6a0f6,bold] #S "
setw -g window-status-format "#[fg=#a5adcb,bg=#24273a] #I:#W "
setw -g window-status-current-format "#[fg=#8aadf4,bg=#24273a] #[fg=#24273a,bg=#8aadf4,bold] #I:#W #[fg=#8aadf4,bg=#24273a] "
setw -g window-status-separator ""
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g message-style "bg=#363a4f,fg=#cad3f5"

# TPM: Tmux Plugin Manager - this section should be at the bottom of tmux.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
