# change prefix
set-option -g prefix C-a
# unbind to prevent conflicts
unbind C-b
# retain shell navigation (bash, zsh)
bind C-a send-prefix
# start windows at 1
set -g base-index 1
# start panes at 1
setw -g pane-base-index 1

# Pull Wayland/PipeWire env vars from the attaching client on each attach
set-option -g update-environment "WAYLAND_DISPLAY XDG_RUNTIME_DIR PIPEWIRE_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS"

# Fallback defaults — update-environment strips vars when SSH/TTY client attaches
# without them, which crashes starship. These provide a safe baseline.
set-environment -g XDG_RUNTIME_DIR "/run/user/1000"
set-environment -g PIPEWIRE_RUNTIME_DIR "/run/user/1000"

# This tmux statusbar config was created by tmuxline.vim
# on Sun, 24 Aug 2025

set -g status-position bottom
set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#ffffff,bg=#585858"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#afdf00"
set -g status-style "none,bg=#303030"
set -g message-style "fg=#ffffff,bg=#585858"
set -g pane-border-style "fg=#585858"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#8a8a8a,bg=#303030"
set -g status-left "#[fg=#005f00,bg=#afdf00,bold] #S #[fg=#afdf00,bg=#303030,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#585858,bg=#303030,nobold,nounderscore,noitalics]#[fg=#bcbcbc,bg=#585858] %Y-%m-%d  %H:%M #[fg=#d0d0d0,bg=#585858,nobold,nounderscore,noitalics]#[fg=#606060,bg=#d0d0d0] #h "
setw -g window-status-format "#[fg=#8a8a8a,bg=#303030] #I #[fg=#8a8a8a,bg=#303030] #W "
setw -g window-status-current-format "#[fg=#303030,bg=#585858,nobold,nounderscore,noitalics]#[fg=#ffffff,bg=#585858] #I #[fg=#ffffff,bg=#585858] #W #[fg=#585858,bg=#303030,nobold,nounderscore,noitalics]"

# TPM: Tmux Plugin Manager - this section should be at the bottom of tmux.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

