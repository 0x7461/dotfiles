# change prefix
set-option -g prefix C-a
# unbind to prevent conflicts
unbind C-b
# retain shell navigation (bash, zsh)
bind C-a send-prefix
# start windows at 1
set -g base-index 1
# start panes at 1
setw -g pane-base-index 1

# Pull Wayland/PipeWire env vars from the attaching client on each attach
set-option -g update-environment "WAYLAND_DISPLAY XDG_RUNTIME_DIR PIPEWIRE_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS"

# Fallback defaults — update-environment strips vars when SSH/TTY client attaches
# without them, which crashes starship. These provide a safe baseline.
set-environment -g XDG_RUNTIME_DIR "/run/user/1000"
set-environment -g PIPEWIRE_RUNTIME_DIR "/run/user/1000"

# True color for Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Copy mode: vi keys + Wayland clipboard
setw -g mode-keys vi
# Let inner apps (Claude Code etc.) set the clipboard via OSC 52; the default
# "external" swallows their copies (tmux-only OSC 52 for tmux's own copies)
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Mouse
set -g mouse on

# Splits: | and -, inherit cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

# Window numbering: keep contiguous
set -g renumber-windows on

# Status bar: minimal, right-aligned. All colors/styling come from the
# matugen-generated snippet (#74) — regenerate via matugen, never hand-edit it.
set -g status on
set -g status-position bottom
set -g status-justify right
set -g status-interval 5
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 40
setw -g window-status-separator ""
source-file ~/.theme/tmux/theme.conf

# TPM: Tmux Plugin Manager - this section should be at the bottom of tmux.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
